[[language]]
name = "go"
auto-format = true
formatter = { command = "goimports" }
language-servers = ["gopls"]

[language-server.gopls]
command = "gopls"
args = ["-logfile=/tmp/gopls.log",  "serve"]

[language-server.gopls.config]
"ui.diagnostic.staticcheck" = true
gofumpt = true
analyses = { unusedparams = true, unreachable = true }

[[language]]
name = "java"
scope = "source.java"
injection-regex = "java"
file-types = ["java"]
roots = ["pom.xml", "build.gradle", ]
indent = { tab-width = 4, unit = "    " }
language-servers = [ "jdtls" ]
formatter = { command = "google-java-format", args = ["--replace"] }

[language-server.jdtls]
jdtls = { command = "jdtls" }
language-server = { command = "jdtls", args = [ "-data", "/home/<USER>/.cache/jdtls/workspace" ] }

[language-server.jdtls.config.java.inlayHints]
parameterNames.enabled = "all"

[[language]]
name = "python"
language-servers = [ "ruff" ]
auto-format = true
indent = { tab-width = 4, unit = "    " }

[language-server.ruff]
command = "ruff"
args = ["server"]

# Override settings for C++
[[language]]
name = "cpp"
auto-format = true               # Format files automatically when saving
indent = { tab-width = 4, unit = "    " } # Use 4 spaces for indentation
formatter = { command = "clang-format", args = ["--style=file", "--assume-filename=main.cpp"] }

# Override settings for C
[[language]]
name = "c"
auto-format = true
indent = { tab-width = 4, unit = "    " }
formatter = { command = "clang-format", args = ["--style=file", "--assume-filename=main.c"] }
